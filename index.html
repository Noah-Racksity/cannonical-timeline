  <style>

:root {
  --bg: #f0f4fa;
  --glass: rgba(255,255,255,0.75);
  --glass-border: rgba(15,23,42,0.12);
  --text: #0f172a;
  --text-dim: #475569;
  --cyan: #00e5ff;
  --violet: #a855f7;
  --red: #ff2d55;
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #f4f7fc;
  color: #0f172a;
  font-family: var(--font-body);
  overflow-x: hidden;
  min-height: 100vh;
}
.binary-bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: 0.22;
}
.binary-column {
  position: absolute; top: -100%;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.3;
  color: #cbd5e1; white-space: nowrap;
  animation: fall linear infinite;
  text-shadow: none;
}
@keyframes fall { to { transform: translateY(200vh); } }

#app {
  position: relative; z-index: 1;
  max-width: 1200px; margin: 0 auto; padding: 36px 20px 60px;
}
header { margin-bottom: 28px; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--cyan); margin-bottom: 8px; }
h1 {
  font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); font-weight: 600; letter-spacing: 0.04em;
  background: linear-gradient(90deg, var(--cyan), var(--violet));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.subtitle { color: #64748b; font-size: 15px; margin-top: 8px; max-width: 560px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; align-items: center; }
.btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: #0f172a;
  font-family: var(--font-mono); font-size: 12px; padding: 7px 12px; border-radius: 4px;
  cursor: pointer; transition: all 0.15s; backdrop-filter: blur(8px);
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 16px rgba(0,229,255,0.25); }
.range-display { margin-left: auto; font-family: var(--font-mono); font-size: 13px; color: var(--cyan); }

#viewport {
  position: relative; height: 320px;
  border: 1px solid var(--glass-border); border-radius: 8px;
  background: rgba(255,255,255,0.72); backdrop-filter: blur(12px);
  overflow: hidden; cursor: grab; touch-action: none;
  box-shadow: 0 4px 24px rgba(15,23,42,0.06);
}
#viewport.grabbing { cursor: grabbing; }
#track { position: absolute; top: 0; left: 0; height: 100%; width: 1px; }

.era-band {
  position: absolute; top: 0; bottom: 0;
  border-left: 1px solid rgba(0,229,255,0.08); border-right: 1px solid rgba(0,229,255,0.08);
  display: flex; justify-content: center; padding-top: 10px; pointer-events: none;
}
.era-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: #64748b; opacity: 0.7; white-space: nowrap; }

.axis-line {
  position: absolute; left: 0; right: 0; top: 170px; height: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--violet)); opacity: 0.7;
  box-shadow: 0 0 12px rgba(0,229,255,0.4);
}
.tick { position: absolute; top: 164px; width: 1px; height: 14px; background: rgba(255,255,255,0.25); }
.tick.major { height: 20px; top: 158px; background: rgba(255,255,255,0.45); }
.tick-label { position: absolute; top: 182px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: #64748b; }

.now-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--red);
  box-shadow: 0 0 12px var(--red), 0 0 24px rgba(255,45,85,0.5);
  z-index: 5; pointer-events: none;
}
.now-label {
  position: absolute; top: 8px; left: 6px;
  font-family: var(--font-mono); font-size: 10px; color: var(--red);
  white-space: nowrap; text-shadow: 0 0 8px rgba(255,45,85,0.6); letter-spacing: 0.05em;
}

.event-marker {
  position: absolute; top: 170px; width: 14px; height: 14px;
  margin-left: -7px; margin-top: -7px; border-radius: 50%;
  border: 2px solid #fff; cursor: pointer; z-index: 3;
  transition: transform 0.15s, box-shadow 0.15s;
}
.event-marker:hover, .event-marker.selected { transform: scale(1.35); box-shadow: 0 0 16px currentColor; }
.event-marker.music {
  border-radius: 3px; transform: rotate(-18deg); width: 16px; height: 16px;
  margin-left: -8px; margin-top: -8px; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  background: #fff !important; border: 1.5px solid var(--cyan); color: var(--cyan);
}
.event-marker.music:hover, .event-marker.music.selected {
  transform: rotate(-18deg) scale(1.3); box-shadow: 0 0 14px var(--cyan);
}

.event-stem { position: absolute; width: 1px; background: rgba(255,255,255,0.2); pointer-events: none; z-index: 1; }
.event-label {
  position: absolute; font-family: var(--font-body); font-weight: 600; font-size: 12.5px; line-height: 18px;
  color: #0f172a; background: rgba(255,255,255,0.9); border: 1px solid var(--glass-border);
  border-left: 3px solid var(--cyan); padding: 2px 8px; border-radius: 0 4px 4px 0;
  cursor: pointer; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  z-index: 2; backdrop-filter: blur(6px);
}
.event-label:hover { color: var(--cyan); }

#detail {
  margin-top: 22px; background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 8px; padding: 24px 26px; min-height: 130px; backdrop-filter: blur(12px);
}
.detail-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; }
.detail-date { font-family: var(--font-mono); font-size: 13px; color: var(--cyan); }
.detail-cat { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #64748b; }
#detail h2 { font-family: var(--font-display); font-size: 20px; margin-bottom: 10px; letter-spacing: 0.02em; color: #0f172a; }
#detail p { font-size: 15px; line-height: 1.55; color: #64748b; max-width: 68ch; }
#detail a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid rgba(0,229,255,0.3); }
#detail a:hover { border-bottom-color: var(--cyan); }
.empty-state { color: #64748b; font-style: italic; }

#legend { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #64748b; }
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-item .cat-dot { width: 9px; height: 9px; }
footer { margin-top: 28px; font-family: var(--font-mono); font-size: 11px; color: #64748b; opacity: 0.7; }
@media (max-width: 640px) { #viewport { height: 260px; } }

/* GitHub Pages / iframe safety */
html, body { width: 100%; min-height: 100%; }
body { min-width: 320px; overflow-x: hidden; }
#app { min-height: 100vh; }

(function createBinary() {
  const bg = document.getElementById('binaryBg');
  const chars = '01';
  for (let i = 0; i < 28; i++) {
    const col = document.createElement('div');
    col.className = 'binary-column';

    col.style.animationDuration = (12 + Math.random() * 18) + 's';
    col.style.animationDelay = (-Math.random() * 20) + 's';

    for (let j = 0; j < 40; j++) text += chars[Math.random() > 0.5 ? 1 : 0] + '<br>';
    col.innerHTML = text;
    bg.appendChild(col);
  }
})();

const viewport = document.getElementById('viewport');
const track = document.getElementById('track');
const detailPanel = document.getElementById('detail');
const rangeDisplay = document.getElementById('rangeDisplay');
const legendEl = document.getElementById('legend');

const DOMAIN_MIN = 0, DOMAIN_MAX = 2100;
const AXIS_GAPS = [{ start: 70, end: 2022, virtual: 55 }];
const NOW_YEAR = 2071;

function yearToUnit(y) {
  let u = y;
  for (const g of AXIS_GAPS) {
    if (y <= g.start) continue;
    if (y >= g.end) { u = u - (g.end - g.start) + g.virtual; continue; }
    return g.start + ((y - g.start) / (g.end - g.start)) * g.virtual;
  }
  return u;
}
function unitToYear(u) {
  let y = u;
  for (const g of AXIS_GAPS) {
    const gs = g.start, ge = g.start + g.virtual;
    if (u <= gs) continue;
    if (u >= ge) { y = y - g.virtual + (g.end - g.start); continue; }
    return g.start + ((u - gs) / g.virtual) * (g.end - g.start);
  }
  return y;
}
const DOMAIN_MIN_U = yearToUnit(DOMAIN_MIN);
const DOMAIN_MAX_U = yearToUnit(DOMAIN_MAX);
const DOMAIN_SPAN_U = DOMAIN_MAX_U - DOMAIN_MIN_U;

let vpWidth = 0, pixelsPerYear = 1, panX = 0, selectedIndex = null;

function fittedPPY() { return vpWidth / (DOMAIN_SPAN_U * 1.1); }
function clampPPY(v) { return Math.min(3500, Math.max(fittedPPY(), v)); }
function clampPan(px) {
  const minX = DOMAIN_MIN_U * pixelsPerYear, maxX = DOMAIN_MAX_U * pixelsPerYear;
  if (maxX - minX <= vpWidth) return vpWidth / 2 - (minX + maxX) / 2;
  return Math.min(-minX, Math.max(vpWidth - maxX, px));
}
function yearToX(y) { return yearToUnit(y) * pixelsPerYear + panX; }
function xToUnit(x) { return (x - panX) / pixelsPerYear; }
function xToYear(x) { return unitToYear(xToUnit(x)); }
function niceStep(target) {
  const steps = [1,2,5,10,25,50,100,250,500,1000,2500,5000];
  for (const s of steps) if (s * pixelsPerYear >= target) return s;
  return steps[steps.length - 1];
}


function niceStep(target) {
  var steps = [1,2,5,10,25,50,100,250,500,1000,2500,5000];
  for (var i = 0; i < steps.length; i++) if (steps[i] * pixelsPerYear >= target) return steps[i];
  return steps[steps.length - 1];
}

function render() {
  vpWidth = viewport.clientWidth;
  pixelsPerYear = clampPPY(pixelsPerYear);
  track.innerHTML = '';
  var axisTop = 170;
  var zoomed = pixelsPerYear > fittedPPY() * 1.8;

  CONFIG.eras.forEach(function(era) {
    if (!era.always && !zoomed) return;
    var x1 = yearToX(era.start), x2 = yearToX(era.end);
    if (x2 < -40 || x1 > vpWidth + 40) return;
    var band = document.createElement('div');
    band.className = 'era-band';
    band.style.left = x1 + 'px';
    band.style.width = Math.max(0, x2 - x1) + 'px';
    band.innerHTML = '<span class="era-label">' + era.label + '</span>';
    track.appendChild(band);
  });

  var axis = document.createElement('div');
  axis.className = 'axis-line';
  axis.style.top = axisTop + 'px';
  track.appendChild(axis);

  var step = niceStep(80);
  var startU = Math.floor(xToUnit(0) / step) * step;
  var endU = Math.ceil(xToUnit(vpWidth) / step) * step;
  var inGap = function(u) {
    return AXIS_GAPS.some(function(g) { return u > g.start && u < g.start + g.virtual; });
  };
  for (var u = startU; u <= endU; u += step) {
    if (inGap(u)) continue;
    var x = u * pixelsPerYear + panX;
    var tick = document.createElement('div');
    tick.className = 'tick major';
    tick.style.left = x + 'px';
    track.appendChild(tick);
    var lab = document.createElement('div');
    lab.className = 'tick-label';
    lab.style.left = x + 'px';
    lab.textContent = Math.round(unitToYear(u));
    track.appendChild(lab);
  }

  AXIS_GAPS.forEach(function(g) {
    [yearToX(g.start), yearToX(g.end)].forEach(function(x) {
      if (x < -20 || x > vpWidth + 20) return;
      var t = document.createElement('div');
      t.className = 'tick major';
      t.style.left = x + 'px';
      track.appendChild(t);
    });
  });

  var nowX = yearToX(NOW_YEAR);
  if (nowX > -10 && nowX < vpWidth + 10) {
    var line = document.createElement('div');
    line.className = 'now-line';
    line.style.left = nowX + 'px';
    var nlab = document.createElement('div');
    nlab.className = 'now-label';
    nlab.textContent = 'MAINTENANT · 2071';
    line.appendChild(nlab);
    track.appendChild(line);
  }

  var LANE_H = 20, FIRST = 22, maxLanes = Math.max(1, Math.floor((axisTop - 28) / LANE_H));
  var measure = document.createElement('canvas').getContext('2d');
  measure.font = '600 12.5px Rajdhani, sans-serif';
  var visible = [];
  EVENTS.forEach(function(ev, i) {
    var x = yearToX(ev.year);
    if (x < -40 || x > vpWidth + 40) return;
    visible.push({ ev: ev, i: i, x: x, w: measure.measureText(ev.title).width + 16 });
  });
  visible.sort(function(a, b) { return a.x - b.x; });
  var laneEnd = [];
  for (var li = 0; li < maxLanes; li++) laneEnd.push(-Infinity);
  visible.forEach(function(item) {
    var start = item.x + 10;
    var lane = -1;
    for (var l = 0; l < maxLanes; l++) {
      if (start > laneEnd[l] + 8) { lane = l; break; }
    }
    if (lane === -1) { item.lane = null; return; }
    laneEnd[lane] = start + item.w;
    item.lane = lane;
  });

  visible.forEach(function(item) {
    var ev = item.ev, i = item.i, x = item.x, lane = item.lane;
    var cat = CONFIG.categories[ev.category] || { color: 'var(--cyan)' };
    var marker = document.createElement('div');
    marker.className = 'event-marker' + (ev.category === 'music' ? ' music' : '') + (selectedIndex === i ? ' selected' : '');
    marker.style.left = x + 'px';
    marker.style.top = axisTop + 'px';
    if (ev.category === 'music') {
      marker.textContent = '💿';
      marker.style.color = cat.color;
    } else {
      marker.style.background = cat.color;
    }
    (function(idx) {
      marker.addEventListener('click', function(e) { e.stopPropagation(); selectEvent(idx); });
    })(i);
    track.appendChild(marker);

    if (lane !== null && pixelsPerYear > 1) {
      var top = axisTop - FIRST - lane * LANE_H;
      var stem = document.createElement('div');
      stem.className = 'event-stem';
      stem.style.left = x + 'px';
      stem.style.top = (top + 9) + 'px';
      stem.style.height = (axisTop - top - 9) + 'px';
      track.appendChild(stem);
      var elab = document.createElement('div');
      elab.className = 'event-label';
      elab.style.left = (x + 10) + 'px';
      elab.style.top = top + 'px';
      elab.style.borderLeftColor = cat.color;
      elab.textContent = ev.title;
      (function(idx) {
        elab.addEventListener('click', function(e) { e.stopPropagation(); selectEvent(idx); });
      })(i);
      track.appendChild(elab);
    }
  });

  rangeDisplay.textContent = Math.round(xToYear(0)) + ' — ' + Math.round(xToYear(vpWidth));
}


function legendSetup() {
  legendEl.innerHTML = '';
  const items = [
    { key: "cosmique", label: "Prophétie & Cosmique", color: "var(--cyan)", icon: null },
    { key: "politique", label: "Politique & Conflits", color: "var(--violet)", icon: null },
    { key: "racksity", label: "Racksity & Personnages", color: "#94a3b8", icon: null },
    { key: "music", label: "Sorties musicales", color: "var(--cyan)", icon: "💿" },
  ];
  items.forEach(c => {
    const d = document.createElement('div');
    d.className = 'legend-item';
    d.style.cursor = 'pointer';
    d.title = 'Afficher tous les evenements de cette categorie';
    if (c.icon) {
      d.innerHTML = '<span style="font-size:14px;margin-right:2px">' + c.icon + '</span>' + c.label;
    } else {
      d.innerHTML = '<span class="cat-dot" style="background:' + c.color + '"></span>' + c.label;
    }
    d.addEventListener('click', function() { showCategory(c.key); });
    legendEl.appendChild(d);
  });
}

function showCategory(key) {
  const map = {
    cosmique: ['prophetie', 'mystique'],
    politique: ['politique', 'guerre'],
    racksity: ['racksity'],
    music: ['music']
  };
  const cats = map[key] || [];
  const list = EVENTS.filter(function(e) { return cats.indexOf(e.category) !== -1; });
  const labels = {
    cosmique: 'Prophetie & Cosmique',
    politique: 'Politique & Conflits',
    racksity: 'Racksity & Personnages',
    music: 'Sorties musicales'
  };
  if (list.length === 0) {
    detailPanel.innerHTML = '<p class="empty-state">Aucun evenement dans cette categorie.</p>';
    return;
  }
  list.sort(function(a,b) { return a.year - b.year; });
  var html = '<div class="detail-eyebrow"><span class="detail-cat">' + (labels[key] || key) + '</span></div>';
  html += '<h2 style="font-size:18px;margin-bottom:14px">' + list.length + ' evenement' + (list.length > 1 ? 's' : '') + '</h2>';
  html += '<ul style="list-style:none;padding:0;margin:0">';
  for (var j = 0; j < list.length; j++) {
    var ev = list[j];
    var idx = EVENTS.indexOf(ev);
    var isMusic = ev.category === 'music';
    html += '<li style="padding:8px 0;border-bottom:1px solid rgba(15,23,42,0.08);cursor:pointer" data-idx="' + idx + '" class="cat-list-item">';
    html += '<span style="font-family:var(--font-mono);font-size:12px;color:var(--cyan)">' + ev.year + '</span> ';
    if (isMusic) html += '💿 ';
    html += '<strong>' + ev.title + '</strong></li>';
  }
  html += '</ul>';
  detailPanel.innerHTML = html;
  var items = detailPanel.querySelectorAll('.cat-list-item');
  for (var k = 0; k < items.length; k++) {
    items[k].addEventListener('click', function() {
      var i = parseInt(this.getAttribute('data-idx'), 10);
      if (!isNaN(i)) selectEvent(i);
    });
  }
}

function selectEvent(i) {
  if (i < 0 || i >= EVENTS.length) return;
  selectedIndex = i;
  var ev = EVENTS[i];
  var cat = CONFIG.categories[ev.category] || {};
  var extra = '';
  if (ev.bandcamp) {
    extra = '<p style="margin-top:12px"><a href="' + ev.bandcamp + '" target="_blank" rel="noopener">Ecouter sur Bandcamp ↗</a></p>';
  }
  var musicIcon = ev.category === 'music' ? '💿 ' : '';
  detailPanel.innerHTML = 
    '<div class="detail-eyebrow">' +
      '<span class="cat-dot" style="background:' + (cat.color || 'var(--cyan)') + '"></span>' +
      '<span class="detail-date">' + ev.year + '</span>' +
      '<span class="detail-cat">' + (cat.label || '') + '</span>' +
    '</div>' +
    '<h2>' + musicIcon + ev.title + '</h2>' +
    '<p>' + (ev.description || '') + '</p>' +
    extra;
  render();
}

function zoomAt(clientX, factor) {
  var rect = viewport.getBoundingClientRect();
  var local = clientX - rect.left;
  var u = xToUnit(local);
  pixelsPerYear = clampPPY(pixelsPerYear * factor);
  panX = clampPan(local - u * pixelsPerYear);
  render();
}
function resetView() {
  pixelsPerYear = fittedPPY();
  panX = clampPan(vpWidth / 2 - (DOMAIN_MIN_U + DOMAIN_MAX_U) / 2 * pixelsPerYear);
  render();
}

viewport.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoomAt(e.clientX, e.deltaY < 0 ? 1.18 : 1 / 1.18);
}, { passive: false });

var drag = false, startX = 0, startPan = 0;
viewport.addEventListener('mousedown', function(e) {
  drag = true; startX = e.clientX; startPan = panX;
  viewport.classList.add('grabbing');
});
window.addEventListener('mousemove', function(e) {
  if (!drag) return;
  panX = clampPan(startPan + (e.clientX - startX));
  render();
});
window.addEventListener('mouseup', function() { drag = false; viewport.classList.remove('grabbing'); });

document.getElementById('zoomIn').onclick = function() { zoomAt(viewport.getBoundingClientRect().left + vpWidth / 2, 1.3); };
document.getElementById('zoomOut').onclick = function() { zoomAt(viewport.getBoundingClientRect().left + vpWidth / 2, 1 / 1.3); };
document.getElementById('resetView').onclick = resetView;
document.getElementById('goAncient').onclick = function() {
  var a = yearToUnit(0), b = yearToUnit(90);
  pixelsPerYear = clampPPY(vpWidth / ((b - a) * 1.2));
  panX = clampPan(vpWidth / 2 - (a + b) / 2 * pixelsPerYear);
  render();
};
document.getElementById('goModern').onclick = function() {
  var a = yearToUnit(2018), b = yearToUnit(2080);
  pixelsPerYear = clampPPY(vpWidth / ((b - a) * 1.15));
  panX = clampPan(vpWidth / 2 - (a + b) / 2 * pixelsPerYear);
  render();
};

window.addEventListener('resize', function() { render(); });
legendSetup();
resetView();

</script>
